name: "Tauri Windows Auto Release"


on:
  push:
    branches:
      - main
  workflow_dispatch:


permissions:
  contents: write
  actions: read


jobs:
  prepare-environment:
    name: Prepare Version & Environment
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calculate.outputs.version }}
      changelog: ${{ steps.calculate.outputs.changelog }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Install dependencies
        run: sudo apt-get install -y jq


      - id: calculate
        shell: bash
        run: |
          set -euo pipefail
          TAURI_FILE="src-tauri/tauri.conf.json"
          git fetch --tags --force
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          RANGE=${PREV_TAG:+$PREV_TAG..HEAD}
          if git log $RANGE --pretty=%B | grep -q "BREAKING CHANGE"; then TYPE="major"
          elif git log $RANGE --pretty=%B | grep -q "^feat:"; then TYPE="minor"
          elif git log $RANGE --pretty=%B | grep -q "^fix:"; then TYPE="patch"
          else TYPE="patch"; fi
          OLD_VERSION=$(jq -r '.version' "$TAURI_FILE")
          if [ -z "$OLD_VERSION" ] || [ "$OLD_VERSION" = "null" ]; then
            echo "Version not found in $TAURI_FILE"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD_VERSION"
          case "$TYPE" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          while git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; do
            PATCH=$((PATCH+1))
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          done
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # Actual commit subjects since the last tag, so the release notes
          # say what changed instead of the old static "this is an update"
          # placeholder text. Drops the bot's own version-bump commits and
          # merge commits since those aren't user-facing changes.
          CHANGELOG=$(git log $RANGE --no-merges --pretty=format:"- %s" | grep -v "^- chore: bump version to" || true)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Minor fixes and improvements"
          fi
          {
            echo "changelog<<CHANGELOG_EOF_9f2a1"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF_9f2a1"
          } >> "$GITHUB_OUTPUT"


      - name: Update version in Tauri config
        run: |
          jq ".version = \"${{ steps.calculate.outputs.version }}\"" src-tauri/tauri.conf.json > tmp.$$.json && mv tmp.$$.json src-tauri/tauri.conf.json


      - name: Update version in package.json
        run: |
          jq ".version = \"${{ steps.calculate.outputs.version }}\"" package.json > tmp.$$.json && mv tmp.$$.json package.json


      - name: Commit updated version to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json package.json
          git commit -m "chore: bump version to v${{ steps.calculate.outputs.version }}" || echo "No version changes to commit"
          git push origin HEAD:main


      - name: Create and push tag
        run: |
          git tag "v${{ steps.calculate.outputs.version }}" || echo "Tag exists"
          git push origin "v${{ steps.calculate.outputs.version }}" || echo "Tag already exists, continuing"


  build-and-release-windows:
    name: Build & Release Windows
    needs: prepare-environment
    runs-on: windows-latest
    steps:
      - name: Checkout code (latest main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0


      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'


      - name: Install dependencies
        run: npm ci

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip
        run: python -m ensurepip --upgrade

      - name: Install uv
        run: pip install uv

      - name: Sync Python dependencies
        run: uv sync
        working-directory: backend

      - name: Run PyInstaller
        run: uv run pyinstaller --clean --name "Siriadmin-backend-x86_64-pc-windows-msvc" --runtime-tmpdir . --onefile --add-data "scripts:scripts" --add-data "utils:utils" --add-data "routes:routes" --add-data "services:services" --add-data "config.py:." --add-data ".env:." app.py
        working-directory: backend

      - name: Copy Python executable to Tauri binaries
        run: |
          if (-not (Test-Path src-tauri/binaries)) { New-Item -ItemType Directory -Path src-tauri/binaries | Out-Null }
          Copy-Item backend/dist/Siriadmin-backend-x86_64-pc-windows-msvc.exe src-tauri/binaries/ -Force


      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked


      - name: Wrap raw updater key into PEM env
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          
          # Load raw key (handle empty)
          $rawKey = "${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}".Trim()
          if (-not $rawKey) {
            Write-Host "Raw updater key secret is empty or not set. Skipping signing (build may fail if required)."
            echo "TAURI_SIGNER_KEY=" >> $env:GITHUB_ENV
            echo "TAURI_SIGNER_PASSWORD=" >> $env:GITHUB_ENV
            exit 0
          }


          # Fold base64 to 64-char lines (PEM standard)
          $folded = $rawKey -replace '(.{64})', "$1`n"


          # Build full PEM string (assume PKCS#8; change to RSA if needed, e.g., if starts with 'MIG')
          $pem = "-----BEGIN PRIVATE KEY-----`n$folded`n-----END PRIVATE KEY-----"
          # For RSA keys: "-----BEGIN RSA PRIVATE KEY-----`n$folded`n-----END RSA PRIVATE KEY-----"


          # Debug
          Write-Host "Wrapped PEM lines: $($pem -split '`n').Count"
          Write-Host "First 50 chars masked: $($pem.Substring(0, [Math]::Min(50, $pem.Length)) -replace '.', '*')"


          # Set env for Tauri build auto-signing
          echo "TAURI_SIGNER_KEY=$pem" >> $env:GITHUB_ENV
          echo "TAURI_SIGNER_PASSWORD=${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}" >> $env:GITHUB_ENV


      - name: Build Tauri App (Windows) with Auto-Signing
        env:
          TAURI_SIGNER_KEY: ${{ env.TAURI_SIGNER_KEY }}
          TAURI_SIGNER_PASSWORD: ${{ env.TAURI_SIGNER_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build


      - name: Prepare Updater Assets (Read Sigs, update.json, Set Bundles for Upload)
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ needs.prepare-environment.outputs.changelog }}
        run: |
          $ErrorActionPreference = "Stop"
          $bundleDir = "src-tauri/target/release/bundle"
          $version = "${{ needs.prepare-environment.outputs.version }}"
          $repo = $env:GITHUB_REPOSITORY
          $tag = "v$version"
          $releaseNotes = $env:RELEASE_NOTES


          # MSI only -- no NSIS/.exe build (tauri.conf.json's bundle.targets
          # is ["msi"] now), so there's nothing to find under bundle/nsis.
          $msi = Get-ChildItem -Path "$bundleDir/msi" -Filter "*.msi" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $msiSig = Get-ChildItem -Path "$bundleDir/msi" -Filter "*.sig" | Sort-Object LastWriteTime -Descending | Select-Object -First 1

          if (-not $msi) { throw "Missing bundle file (MSI not found)" }

          $msiSigContent = if ($msiSig) { Get-Content -Path $msiSig.FullName -Raw -Encoding UTF8 } else { Write-Host "No MSI .sig found"; "" }

          Write-Host "Found MSI: $($msi.FullName)"

          # Generate update.json with a direct URL to the .msi (for Tauri updater ingestion format)
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $msiName = [System.Uri]::EscapeDataString($(Split-Path $msi.FullName -Leaf))
          $msiUrl = "https://github.com/$repo/releases/download/$tag/$msiName"

          # Both "windows-x86_64" and "windows-x86_64-msi" point at the same
          # MSI artifact -- the installed app's updater log shows it
          # searching for the "-msi"-suffixed key FIRST (before falling
          # back to the bare key), and whether that fallback actually
          # succeeds isn't something to gamble on. Publishing both makes
          # the very first lookup succeed directly.
          $updateJson = @{
            version = $version
            notes = $releaseNotes
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $msiSigContent.Trim()
                url = $msiUrl
              }
              "windows-x86_64-msi" = @{
                signature = $msiSigContent.Trim()
                url = $msiUrl
              }
            }
          } | ConvertTo-Json -Depth 6


          $updatePath = "$bundleDir/update.json"
          $updateJson | Out-File -FilePath $updatePath -Encoding UTF8
          Write-Host "Generated update.json"


          # Set assets: .msi and update.json
          $assets = "$($msi.FullName) $updatePath"
          echo "ASSETS=$assets" >> $env:GITHUB_ENV


      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: ${{ needs.prepare-environment.outputs.changelog }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v${{ needs.prepare-environment.outputs.version }}"
          $assets = $env:ASSETS -split ' '


          gh auth status


          $notesFile = "release-notes.md"
          "## What's Changed`n`n$($env:RELEASE_NOTES)" | Out-File -FilePath $notesFile -Encoding UTF8

          # Create if not exists, otherwise refresh the notes on the existing release
          gh release view $tag --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Siri Admin App $tag" --notes-file $notesFile --repo $env:GITHUB_REPOSITORY
          } else {
            gh release edit $tag --notes-file $notesFile --repo $env:GITHUB_REPOSITORY
          }


          # Upload assets (.msi, update.json)
          foreach ($asset in $assets) {
            if (Test-Path $asset) {
              Write-Host "Uploading $asset..."
              gh release upload $tag $asset --clobber --repo $env:GITHUB_REPOSITORY
            }
          }
